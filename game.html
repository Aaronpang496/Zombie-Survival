<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080e16;
  color: #e2e8f0;
  font-family: system-ui, sans-serif;
}
.wrap { max-width: 480px; margin: auto; padding: 8px; }
.hud {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: bold;
  padding: 12px 0;
  font-size: 14px;
}
.arena { position: relative; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #334155;
  border-radius: 14px;
  background: #101b24;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#panel {
  position: absolute;
  inset: 0;
  background: rgba(4, 9, 16, .88);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 22px;
  text-align: center;
  border-radius: 14px;
}
#panel.hidden { display: none; }
h2 { color: #86efac; margin: 8px 0; }
#message { line-height: 1.5; }
#choices { width: 100%; max-width: 320px; }
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #86efac;
  color: #052e16;
  padding: 13px;
  font: bold 15px system-ui;
}
#choices button { display: block; width: 100%; margin: 10px 0; }
.controls { display: flex; gap: 10px; margin-top: 12px; }
.controls button { flex: 1; }
#pause { background: #a5b4fc; color: #1e1b4b; }
small { display: block; color: #94a3b8; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span id="health">Lives: 3</span>
    <span id="wave">Wave: 1</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="arena">
    <canvas id="game" width="480" height="600"
            tabindex="0" aria-label="Zombie survival arena"></canvas>
    <div id="panel">
      <h2 id="heading"></h2>
      <p id="message"></p>
      <div id="choices"></div>
    </div>
  </div>

  <div class="controls">
    <button id="restart">New game</button>
    <button id="pause">Pause</button>
  </div>

  <small>
    Drag anywhere in the arena to move. Shooting is automatic.<br>
    Keyboard: arrow keys or WASD. Clear every zombie to upgrade.<br>
    Pink zombies are fast. Large zombies have extra health.
  </small>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
const W = 480, H = 600;

let mode = "ready";
let player, enemies = [], bullets = [], particles = [];
let wave = 1, score = 0, remaining = 0;
let spawnClock = 0, shotClock = 0, invulnerability = 0;
let elapsed = 0, pointer = null, lastPointer = null;
const keys = new Set();

function hud() {
  $("health").textContent = "Lives: " + player.hp;
  $("wave").textContent = "Wave: " + wave;
  $("score").textContent = "Score: " + score;
}

function releaseControls() {
  keys.clear();
  pointer = null;
  lastPointer = null;
}

function showPanel(title, message, options) {
  $("heading").textContent = title;
  $("message").textContent = message;
  $("choices").replaceChildren();

  for (const [label, action] of options) {
    const button = document.createElement("button");
    button.textContent = label;
    button.onclick = action;
    $("choices").appendChild(button);
  }

  $("panel").classList.remove("hidden");
}

function startWave() {
  releaseControls();
  remaining = 6 + wave * 3;
  spawnClock = 0.5;
  shotClock = 0;
  invulnerability = Math.max(invulnerability, 1);
  mode = "playing";
  $("pause").textContent = "Pause";
  $("panel").classList.add("hidden");
  hud();
}

function reset() {
  player = {
    x: W / 2, y: H / 2, r: 13,
    hp: 3, damage: 1, fireRate: 0.48, speed: 225
  };
  enemies = [];
  bullets = [];
  particles = [];
  wave = 1;
  score = 0;
  elapsed = 0;
  invulnerability = 0;
  startWave();
}

function upgrade() {
  mode = "upgrade";
  releaseControls();
  bullets = [];

  function choose(apply) {
    apply();
    wave += 1;
    startWave();
  }

  showPanel(
    "WAVE CLEARED!",
    "Choose one upgrade before the next wave.",
    [
      [
        player.fireRate > 0.13 ? "⚡ Fire 18% faster" : "💥 Stronger bullets",
        () => choose(() => {
          if (player.fireRate > 0.13) {
            player.fireRate = Math.max(0.12, player.fireRate * 0.82);
          } else {
            player.damage += 1;
          }
        })
      ],
      ["🔥 +1 bullet damage", () => choose(() => player.damage += 1)],
      [
        player.hp < 3 ? "❤️ Recover one life" : "👟 Move 10% faster",
        () => choose(() => {
          if (player.hp < 3) player.hp += 1;
          else player.speed = Math.min(420, player.speed * 1.1);
        })
      ]
    ]
  );
}

function gameOver() {
  mode = "over";
  releaseControls();
  showPanel(
    "OVERRUN!",
    "You reached wave " + wave + " and scored " + score + " points.",
    [["Try again", reset]]
  );
}

function pauseGame() {
  if (mode === "playing") {
    mode = "paused";
    releaseControls();
    $("pause").textContent = "Resume";
    showPanel("PAUSED", "Take a breath. The zombies can wait.", [
      ["Resume", pauseGame]
    ]);
  } else if (mode === "paused") {
    mode = "playing";
    $("pause").textContent = "Pause";
    $("panel").classList.add("hidden");
  }
}

function burst(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 130;
    particles.push({
      x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      life: 0.55, color
    });
  }
}

function spawn() {
  const fast = wave >= 2 && Math.random() < 0.25;
  const tank = !fast && wave >= 3 && Math.random() < 0.22;
  const edge = Math.floor(Math.random() * 4);
  let x, y;

  if (edge === 0) { x = -30; y = Math.random() * H; }
  if (edge === 1) { x = W + 30; y = Math.random() * H; }
  if (edge === 2) { x = Math.random() * W; y = -30; }
  if (edge === 3) { x = Math.random() * W; y = H + 30; }

  const hp = (tank ? 5 : 1) + Math.floor((wave - 1) / 3);

  enemies.push({
    x, y, r: tank ? 23 : fast ? 12 : 16,
    hp, maxHp: hp,
    speed: Math.min(165, 38 + wave * 5) * (fast ? 1.5 : tank ? 0.65 : 1),
    color: tank ? "#b794f6" : fast ? "#fb7185" : "#86efac"
  });

  remaining -= 1;
}

function shoot() {
  if (!enemies.length) return;

  let target = enemies[0];
  let distance = Infinity;

  for (const enemy of enemies) {
    const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (d < distance) {
      target = enemy;
      distance = d;
    }
  }

  const angle = Math.atan2(target.y - player.y, target.x - player.x);
  bullets.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * 520,
    vy: Math.sin(angle) * 520,
    life: 1.7
  });
}

function clampPlayer() {
  player.x = Math.max(18, Math.min(W - 18, player.x));
  player.y = Math.max(18, Math.min(H - 18, player.y));
}

function update(dt) {
  if (mode !== "playing") return;

  elapsed += dt;
  invulnerability = Math.max(0, invulnerability - dt);

  let dx = Number(keys.has("ArrowRight") || keys.has("d")) -
           Number(keys.has("ArrowLeft") || keys.has("a"));
  let dy = Number(keys.has("ArrowDown") || keys.has("s")) -
           Number(keys.has("ArrowUp") || keys.has("w"));
  const length = Math.hypot(dx, dy) || 1;

  player.x += dx / length * player.speed * dt;
  player.y += dy / length * player.speed * dt;
  clampPlayer();

  // Touch movement has the same speed limit as keyboard movement.
  if (lastPointer) {
    const tx = lastPointer.x - player.x;
    const ty = lastPointer.y - player.y;
    const distance = Math.hypot(tx, ty);
    if (distance > 1) {
      const step = Math.min(distance, player.speed * dt);
      player.x += tx / distance * step;
      player.y += ty / distance * step;
      clampPlayer();
    }
  }

  spawnClock -= dt;
  if (remaining > 0 && spawnClock <= 0) {
    spawn();
    spawnClock = Math.max(0.22, 0.9 - wave * 0.045);
  }

  shotClock -= dt;
  if (shotClock <= 0 && enemies.length) {
    shoot();
    shotClock = player.fireRate;
  }

  for (const enemy of enemies) {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const distance = Math.hypot(dx, dy) || 1;
    enemy.x += dx / distance * enemy.speed * dt;
    enemy.y += dy / distance * enemy.speed * dt;
  }

  for (const bullet of bullets) {
    bullet.x += bullet.vx * dt;
    bullet.y += bullet.vy * dt;
    bullet.life -= dt;

    if (bullet.life <= 0) continue;

    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < enemy.r + 4) {
        enemy.hp -= player.damage;
        bullet.life = 0;
        burst(bullet.x, bullet.y, "#facc15", 4);

        if (enemy.hp <= 0) {
          score += 10;
          burst(enemy.x, enemy.y, enemy.color);
        }
        break;
      }
    }
  }

  enemies = enemies.filter(enemy => enemy.hp > 0);
  bullets = bullets.filter(bullet =>
    bullet.life > 0 &&
    bullet.x > -20 && bullet.x < W + 20 &&
    bullet.y > -20 && bullet.y < H + 20
  );

  for (const enemy of enemies) {
    if (invulnerability <= 0 &&
        Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.r + player.r) {
      player.hp -= 1;
      invulnerability = 1.5;
      burst(player.x, player.y, "#fb7185", 24);

      // Push the attacker away to give the player room to escape.
      const dx = enemy.x - player.x;
      const dy = enemy.y - player.y;
      const length = Math.hypot(dx, dy) || 1;
      enemy.x += dx / length * 70;
      enemy.y += dy / length * 70;

      if (player.hp <= 0) gameOver();
      break;
    }
  }

  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);

  hud();
  if (mode === "playing" && remaining === 0 && enemies.length === 0) {
    upgrade();
  }
}

function circle(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = "#1b2c38";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  for (const enemy of enemies) {
    circle(enemy.x, enemy.y, enemy.r, enemy.color);
    circle(enemy.x - 5, enemy.y - 3, 2.5, "#101b24");
    circle(enemy.x + 5, enemy.y - 3, 2.5, "#101b24");

    ctx.fillStyle = "#334155";
    ctx.fillRect(enemy.x - 15, enemy.y - enemy.r - 9, 30, 4);
    ctx.fillStyle = "#fb7185";
    ctx.fillRect(
      enemy.x - 15, enemy.y - enemy.r - 9,
      30 * Math.max(0, enemy.hp / enemy.maxHp), 4
    );
  }

  ctx.shadowBlur = 12;
  ctx.shadowColor = "#facc15";
  for (const bullet of bullets) {
    circle(bullet.x, bullet.y, 4, "#fef08a");
  }
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.55);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;

  if (player && mode !== "over") {
    ctx.save();
    ctx.globalAlpha = invulnerability > 0
      ? 0.4 + Math.abs(Math.sin(elapsed * 18)) * 0.6 : 1;
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#38bdf8";
    circle(player.x, player.y, player.r, "#38bdf8");
    ctx.shadowBlur = 0;
    circle(player.x - 4, player.y - 3, 2, "#082f49");
    circle(player.x + 4, player.y - 3, 2, "#082f49");
    ctx.restore();
  }

  if (mode === "playing") {
    ctx.fillStyle = "#94a3b8";
    ctx.font = "13px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(
      "Zombies left: " + (remaining + enemies.length),
      W / 2, 24
    );
  }
}

function point(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * W / rect.width,
    y: (event.clientY - rect.top) * H / rect.height
  };
}

canvas.addEventListener("pointerdown", event => {
  if (mode !== "playing" || pointer !== null) return;
  pointer = event.pointerId;
  lastPointer = point(event);
  canvas.setPointerCapture(pointer);
  canvas.focus();
  event.preventDefault();
});

canvas.addEventListener("pointermove", event => {
  if (pointer !== event.pointerId) return;
  lastPointer = point(event);
  event.preventDefault();
});

function release(event) {
  if (event.pointerId === pointer) {
    pointer = null;
    lastPointer = null;
  }
}

canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("lostpointercapture", release);

window.addEventListener("keydown", event => {
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d"].includes(key)) {
    event.preventDefault();
    keys.add(key);
  }
});

window.addEventListener("keyup", event => {
  keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
});

window.addEventListener("blur", () => {
  if (mode === "playing") pauseGame();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && mode === "playing") pauseGame();
});

$("restart").onclick = () => {
  if (mode === "ready" || mode === "over") reset();
  else {
    if (mode === "playing") pauseGame();
    showPanel("NEW GAME?", "Restart from wave 1?", [
      ["Restart", reset],
      ["Keep current game", () => {
        if (mode === "upgrade") upgrade();
        else pauseGame();
      }]
    ]);
  }
};
$("pause").onclick = pauseGame;

showPanel(
  "ZOMBIE SURVIVAL",
  "Keep moving. Your weapon aims automatically. Survive each wave to upgrade!",
  [["Start survival", reset]]
);

let previous = performance.now();
function frame(time) {
  const dt = Math.min((time - previous) / 1000, 0.033);
  previous = time;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
